<title>오토매크로</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: phone-first app shell (max 560px), sticky top bar, fixed bottom tabs, bottom sheets.
   Color carries meaning like the original: trigger = red, action = blue, constraint = green. */
:root {
  --bg: #EDEFF3;
  --surface: #FFFFFF;
  --surface-2: #F5F6F9;
  --line: #D9DEE7;
  --fg: #141922;
  --muted: #5B6474;
  --trig: #CF3F37;
  --act: #2A64CC;
  --cons: #21895A;
  --warn: #B07A07;
  --on-color: #FFFFFF;
  --shadow: 0 1px 2px rgba(20, 25, 34, .06), 0 4px 16px rgba(20, 25, 34, .06);
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1015; --surface: #161A21; --surface-2: #1D222B; --line: #2A303B;
    --fg: #E7EAF0; --muted: #97A0AF; --trig: #EF645B; --act: #5D92F2; --cons: #47C07F;
    --warn: #E0AE3C; --on-color: #0D1015; --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1015; --surface: #161A21; --surface-2: #1D222B; --line: #2A303B;
  --fg: #E7EAF0; --muted: #97A0AF; --trig: #EF645B; --act: #5D92F2; --cons: #47C07F;
  --warn: #E0AE3C; --on-color: #0D1015; --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--act); outline-offset: 2px; }
.mono-txt, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 10px; display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--line);
}
.top h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.01em; flex: 1; min-width: 0; text-wrap: balance; }
.brand { display: flex; align-items: center; gap: 8px; }
.brand-mark { display: grid; grid-template-columns: repeat(3, 6px); gap: 2px; }
.brand-mark i { width: 6px; height: 14px; border-radius: 2px; display: block; }
.brand-mark i:nth-child(1) { background: var(--trig); }
.brand-mark i:nth-child(2) { background: var(--act); }
.brand-mark i:nth-child(3) { background: var(--cons); }
.content {
  flex: 1; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 104px; display: flex; flex-direction: column; gap: 18px;
}
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { background: none; border: 0; padding: 9px 2px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; color: var(--muted); }
.tab b { width: 22px; height: 4px; border-radius: 4px; background: transparent; }
.tab.on { color: var(--fg); font-weight: 600; }
.tab.on b { background: var(--act); }

.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0; }
.sec-h h2 { font-size: 13px; font-weight: 600; letter-spacing: .06em; color: var(--muted); margin: 0; text-transform: uppercase; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.row:first-child { border-top: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 600; overflow-wrap: anywhere; }
.row .s { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.mono { flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 15px; color: var(--on-color); }
.mono.k-trigger { background: var(--trig); }
.mono.k-action { background: var(--act); }
.mono.k-constraint { background: var(--cons); }
.mono.k-off { background: var(--line); color: var(--muted); }

.status { padding: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.stat .l { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.stat .v { font-size: 17px; font-weight: 600; }
.engine { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--cons); box-shadow: 0 0 0 4px color-mix(in srgb, var(--cons) 22%, transparent); flex: none; }
.dot.idle { background: var(--muted); box-shadow: none; }

.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px 10px 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; text-align: left; box-shadow: var(--shadow); min-height: 92px; }
.tile .tl { font-weight: 600; font-size: 14px; line-height: 1.3; }
.tile .ts { font-size: 12px; color: var(--muted); }
.tile-bar { width: 26px; height: 6px; border-radius: 3px; }

.notice { font-size: 13px; color: var(--muted); padding: 12px 14px; border: 1px dashed var(--line); border-radius: 12px; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
.btn.primary { background: var(--act); border-color: var(--act); color: var(--on-color); }
.btn.danger { color: var(--trig); }
.btn.danger.armed { background: var(--trig); border-color: var(--trig); color: var(--on-color); }
.btn.sm { padding: 6px 10px; font-size: 13px; }
.btn.ghost { background: none; border-color: transparent; }
.btn:disabled { opacity: .45; cursor: default; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.icon-btn { background: none; border: 0; padding: 6px 8px; border-radius: 8px; color: var(--muted); font-size: 13px; font-weight: 600; }
.icon-btn:hover { background: var(--surface-2); }

.sw { flex: none; width: 44px; height: 26px; border-radius: 13px; border: 0; background: var(--line); position: relative; padding: 0; transition: background .15s; }
.sw span { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.sw.on { background: var(--cons); }
.sw.on span { transform: translateX(18px); }

.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .lab { font-size: 13px; font-weight: 600; color: var(--muted); }
.inp { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; min-width: 0; }
textarea.inp { min-height: 84px; resize: vertical; }
.hint { font-size: 12px; color: var(--muted); }
.days { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 11px; font-size: 13px; font-weight: 600; }
.chip.on { background: var(--act); border-color: var(--act); color: var(--on-color); }

.ed-head { display: flex; flex-direction: column; gap: 12px; padding: 14px; }
.ed-row2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 10px; }
.block { overflow: hidden; }
.block-h { display: flex; align-items: center; gap: 10px; padding: 11px 14px; color: var(--on-color); }
.block-h h3 { margin: 0; font-size: 15px; flex: 1; }
.block-h .q { font-size: 12px; opacity: .85; }
.block-h.k-trigger { background: var(--trig); }
.block-h.k-action { background: var(--act); }
.block-h.k-constraint { background: var(--cons); }
.add { width: 100%; border: 0; border-top: 1px solid var(--line); background: none; padding: 11px 14px; text-align: left; font-weight: 600; color: var(--act); }
.empty { padding: 14px; font-size: 13px; color: var(--muted); }
.item { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 14px; border-top: 1px solid var(--line); }
.item:first-of-type { border-top: 0; }
.item .grow { flex: 1; min-width: 0; cursor: pointer; }
.item .t { font-weight: 600; font-size: 14px; }
.item .s { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.item .mono { width: 30px; height: 30px; font-size: 13px; border-radius: 8px; }
.ops { display: flex; gap: 2px; flex: none; }

.overlay { position: fixed; inset: 0; background: rgba(8, 10, 14, .45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--surface); width: 100%; max-width: 560px; max-height: 88%; overflow: auto;
  border-radius: 18px 18px 0 0; padding-block: 8px calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 0; }
.sheet h3 { margin: 0; font-size: 18px; }
.pick-g { display: flex; flex-direction: column; gap: 8px; }
.pick-g h4 { margin: 0; font-size: 12px; letter-spacing: .06em; color: var(--muted); }
.pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pick button { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 10px; text-align: left; font-size: 14px; font-weight: 600; min-width: 0; }
.pick button span.lbl { min-width: 0; overflow-wrap: anywhere; }
.pick .mono { width: 30px; height: 30px; font-size: 13px; border-radius: 8px; }

.toasts { position: fixed; left: 0; right: 0; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 30; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.toast { pointer-events: auto; max-width: 520px; width: 100%; background: var(--fg); color: var(--bg); border-radius: 12px; padding: 11px 14px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.25); overflow-wrap: anywhere; }
.toast b { display: block; font-size: 13px; opacity: .75; }

.log { font-family: var(--font-mono); font-size: 12.5px; }
.log .row { padding: 8px 12px; align-items: flex-start; gap: 10px; }
.log .tm { color: var(--muted); flex: none; }
.lv { flex: none; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 6px; border: 1px solid currentColor; }
.lv.run { color: var(--act); }
.lv.ok { color: var(--cons); }
.lv.skip { color: var(--warn); }
.lv.err { color: var(--trig); }
.lv.info { color: var(--muted); }
.search { display: flex; gap: 8px; }
.cat-h { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .06em; padding: 10px 14px 4px; }
.cat-h:not(:first-child) { border-top: 1px solid var(--line); }
.tpl { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.tpl .t { font-weight: 700; font-size: 16px; }
.flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; }
.pill { border-radius: 999px; padding: 2px 9px; font-weight: 600; color: var(--on-color); }
.pill.k-trigger { background: var(--trig); }
.pill.k-action { background: var(--act); }
.pill.k-constraint { background: var(--cons); }
.var-row .val { font-family: var(--font-mono); font-size: 14px; }
.inline-form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); }
@media (max-width: 400px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .inline-form { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
(function () {
'use strict';

    this.run(m, { label, depth: depth || 0 });
  }
  fmt(str, ctx) {
    const d = new Date(), s = this.s, vars = this.api.get().vars;
    return String(str ?? '').replace(/\{(\w+)(?:=([^}]+))?\}/g, (all, k, v) => {
      switch (k) {
        case 'time': return hhmm(d); case 'date': return ymd(d);
        case 'weekday': return DAYS[d.getDay()] + '요일';
        case 'battery': return s.battery === null ? '?' : String(s.battery);
        case 'charging': return s.charging ? '충전 중' : '충전 안 함';
        case 'online': return navigator.onLine ? '연결됨' : '끊김';
        case 'macro': return ctx && ctx.macro ? ctx.macro : '';
        case 'trigger': return ctx && ctx.label ? ctx.label : '';
        case 'v': return v in vars ? String(vars[v]) : '';
      }
      return all;
    });
  }
  setVar(name, op, value, depth) {
    if (!name) return;
    let next;
    this.api.update((st) => {
      const cur = st.vars[name];
      switch (op) {
        case 'add': next = String((Number(cur) || 0) + (Number(value) || 0)); break;
        case 'sub': next = String((Number(cur) || 0) - (Number(value) || 0)); break;
        case 'append': next = String(cur ?? '') + value; break;
        case 'toggle': next = String(!(cur === true || cur === 'true' || cur === '1')); break;
        default: next = String(value);
      }
      return Object.assign({}, st, { vars: Object.assign({}, st.vars, { [name]: next }) });
    });
    if (depth < 6) this.emit('variable', (p) => p.name === name && cmp(next, p.op, p.value), `변수 ${name} = ${next}`, depth + 1);
  }
  sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }
  async beep(freq, ms, times) {
    try {
      this.audio = this.audio || new (window.AudioContext || window.webkitAudioContext)();
      if (this.audio.state === 'suspended') await this.audio.resume();
      for (let i = 0; i < times; i++) {
        const o = this.audio.createOscillator(), g = this.audio.createGain();
        o.frequency.value = freq; o.type = 'sine'; g.gain.value = 0.15;
        o.connect(g); g.connect(this.audio.destination); o.start(); await this.sleep(ms); o.stop(); await this.sleep(120);
      }
    } catch (e) { this.log('err', '소리를 재생할 수 없습니다.'); }
  }
  speak(text, rate) {
    return new Promise((res) => {
      if (!('speechSynthesis' in window)) { this.log('err', '이 브라우저는 음성 읽기를 지원하지 않습니다.'); return res(); }
      const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR'; u.rate = Number(rate) || 1;
      const done = () => { clearTimeout(t); res(); }; const t = setTimeout(res, 30000);
      u.onend = done; u.onerror = done; speechSynthesis.speak(u);
    });
  }
  async run(m, ctx) {
    ctx = Object.assign({ macro: m.name, label: '', depth: 0 }, ctx);
    if (ctx.depth > 6) { this.log('err', `「${m.name}」 중첩 실행이 너무 깊어 중단했습니다.`); return; }
    const acts = m.actions, jump = {}, stack = [];
    acts.forEach((a, i) => {
      if (a.type === 'if') stack.push({ i, e: null });
      else if (a.type === 'else' && stack.length) stack[stack.length - 1].e = i;
      else if (a.type === 'end_if' && stack.length) { const b = stack.pop(); jump[b.i] = { e: b.e, end: i }; if (b.e !== null) jump[b.e] = { end: i }; }
    });
    this.running++; this.push();
    this.log('run', `「${m.name}」 실행${ctx.test ? ' (테스트)' : ''}${ctx.label ? ' · 트리거: ' + ctx.label : ''}`);
    this.api.update((st) => Object.assign({}, st, { macros: st.macros.map((x) => (x.id === m.id ? Object.assign({}, x, { lastRun: Date.now() }) : x)) }));
    let i = 0;
    try {
      while (i < acts.length) {
        const a = acts[i], p = a.params, f = (v) => this.fmt(v, ctx);
        switch (a.type) {
          case 'notify': {
            const title = f(p.title), body = f(p.text); let shown = false;
            try { if ('Notification' in window && Notification.permission === 'granted') { new Notification(title, { body }); shown = true; } } catch (e) {}
            if (!shown) this.api.toast(body, title, 5);
            break;
          }
          case 'toast': this.api.toast(f(p.text), null, Number(p.sec) || 3); break;
          case 'speak': await this.speak(f(p.text), p.rate); break;
          case 'vibrate': {
            const pat = String(p.pattern).split(',').map((x) => Number(x.trim())).filter((x) => !isNaN(x));
            if (!(navigator.vibrate && navigator.vibrate(pat))) this.log('info', '이 기기는 진동을 지원하지 않습니다.');
            break;
          }
          case 'beep': await this.beep(Number(p.freq) || 880, Number(p.ms) || 300, Math.min(10, Number(p.times) || 1)); break;
          case 'http': {
            const url = f(p.url);
            try {
              const r = await fetch(url, { method: p.method, body: p.method === 'POST' ? f(p.body) : undefined, headers: p.method === 'POST' ? { 'Content-Type': 'application/json' } : undefined });
              const txt = (await r.text()).slice(0, 2000);
              this.log('ok', `HTTP ${r.status} · ${url}`);
              if (p.saveTo) this.setVar(p.saveTo, 'set', txt, ctx.depth);
            } catch (e) { this.log('err', 'HTTP 요청 실패: ' + url); }
            break;
          }
          case 'open_url': { const url = f(p.url); let w = null; try { w = window.open(url, '_blank'); } catch (e) {} if (!w) this.api.toast(url, '이 주소를 열어 주세요', 6); break; }
          case 'set_var': this.setVar(p.name, p.op, f(p.value), ctx.depth); break;
          case 'if': {
            const ok = cmp(this.api.get().vars[p.name], p.op, f(p.value)), j = jump[i];
            if (!ok && j) { i = (j.e !== null ? j.e : j.end) + 1; continue; }
            break;
          }
          case 'else': { const j = jump[i]; if (j) { i = j.end + 1; continue; } break; }
          case 'end_if': break;
          case 'wait': await this.sleep(Math.max(0, Number(p.sec) || 0) * 1000); break;
          case 'run_macro': {
            const t = this.api.get().macros.find((x) => x.id === p.id);
            if (!t) { this.log('err', '실행할 매크로를 찾을 수 없습니다.'); break; }
            if (p.ignore === 'no') { const fail = this.checkConstraints(t); if (fail) { this.log('skip', `「${t.name}」 건너뜀 · ${fail}`); break; } }
            await this.run(t, { label: '「' + m.name + '」에서 호출', depth: ctx.depth + 1 });
            break;
          }
          case 'enable_macro':
            this.api.update((st) => Object.assign({}, st, { macros: st.macros.map((x) => (x.id === p.id ? Object.assign({}, x, { enabled: p.mode === 'on' ? true : p.mode === 'off' ? false : !x.enabled }) : x)) }));
            break;
          case 'stop': this.log('info', `「${m.name}」 중단 액션으로 종료`); i = acts.length; continue;
          case 'copy': try { await navigator.clipboard.writeText(f(p.text)); } catch (e) { this.log('err', '클립보드에 복사하지 못했습니다. 화면을 한 번 누른 뒤 다시 시도하세요.'); } break;
          case 'share': try { await navigator.share({ text: f(p.text) }); } catch (e) { this.log('err', '공유 창을 열 수 없습니다.'); } break;
          case 'wake_lock':
            try {
              if (p.state === 'on') { this.wake = await navigator.wakeLock.request('screen'); }
              else if (this.wake) { await this.wake.release(); this.wake = null; }
            } catch (e) { this.log('err', '화면 켜짐 유지를 사용할 수 없습니다.'); }
            break;
          case 'log': this.log('info', f(p.text)); break;
        }
        i++;
      }
      this.log('ok', `「${m.name}」 완료`);
    } catch (e) { this.log('err', `「${m.name}」 오류: ${e.message}`); }
    finally { this.running--; this.push(); }
  }
}

/* ---------------- UI 조각 ---------------- */
function Switch({ on, onChange, label }) {
  return html`<button type="button" role="switch" aria-checked=${on} aria-label=${label} class=${'sw' + (on ? ' on' : '')}
    onClick=${(e) => { e.stopPropagation(); onChange(!on); }}><span></span></button>`;
}
function Mono({ kind, def, off }) {
  return html`<span class=${'mono ' + (off ? 'k-off' : 'k-' + kind)} aria-hidden="true">${def ? def.mono : '?'}</span>`;
}
function Sheet({ onClose, children }) {
  useEffect(() => { const k = (e) => { if (e.key === 'Escape') onClose(); }; addEventListener('keydown', k); return () => removeEventListener('keydown', k); }, []);
  return html`<div class="overlay" onClick=${onClose}><div class="sheet" role="dialog" aria-modal="true" onClick=${(e) => e.stopPropagation()}><div class="grab"></div>${children}</div></div>`;
}
function ConfirmBtn({ label, armedLabel, onConfirm, cls }) {
  const [armed, setArmed] = useState(false);
  useEffect(() => { if (!armed) return; const t = setTimeout(() => setArmed(false), 3000); return () => clearTimeout(t); }, [armed]);
  return html`<button type="button" class=${'btn danger ' + (cls || '') + (armed ? ' armed' : '')} onClick=${() => (armed ? onConfirm() : setArmed(true))}>${armed ? armedLabel : label}</button>`;
}
function timeAgo(t) {
  if (!t) return '실행 기록 없음';
  const s = Math.floor((Date.now() - t) / 1000);
  if (s < 60) return '방금 실행'; if (s < 3600) return Math.floor(s / 60) + '분 전 실행';
  if (s < 86400) return Math.floor(s / 3600) + '시간 전 실행'; return Math.floor(s / 86400) + '일 전 실행';
}

/* ---------------- 화면: 홈 ---------------- */
function Home({ st, sensors, go, engine, onNew }) {

  const tiles = [

    ['매크로', st.macros.length + '개', 'var(--act)', () => go('macros')],
    ['템플릿', TEMPLATES.length + '개 준비됨', 'var(--cons)', () => go('templates')],
    ['변수', Object.keys(st.vars).length + '개', 'var(--warn)', () => go('vars')],
    ['시스템 로그', st.log.length + '줄', 'var(--muted)', () => go('log')],
    ['설정', '권한·백업', 'var(--line)', () => go('settings')],
  ];
  return html`
    <section class="card status" aria-label="엔진 상태">
      <div class="engine"><span class=${'dot' + (enabled ? '' : ' idle')}></span>
        <div class="grow"><div style=${{ fontWeight: 600 }}>${enabled ? '매크로 엔진 작동 중' : '켜진 매크로 없음'}</div>
        <div class="small muted">켜진 매크로 ${enabled}개 / 전체 ${st.macros.length}개${sensors.running ? ' · 지금 실행 중 ' + sensors.running + '개' : ''}</div></div>
      </div>
      <div class="stat"><div class="l">배터리</div><div class="v num">${sensors.battery === null ? '–' : sensors.battery + '%'}</div><div class="small muted">${sensors.charging === null ? '정보 없음' : sensors.charging ? '충전 중' : '충전 안 함'}</div></div>
      <div class="stat"><div class="l">인터넷</div><div class="v">${sensors.online ? '연결됨' : '끊김'}</div><div class="small muted">화면 ${sensors.orientation === 'portrait' ? '세로' : '가로'}</div></div>
    </section>
    <section class="tiles" aria-label="메뉴">
      ${tiles.map(([l, s, c, fn]) => html`<button key=${l} type="button" class="tile" onClick=${fn}><span class="tile-bar" style=${{ background: c }}></span><span><div class="tl">${l}</div><div class="ts">${s}</div></span></button>`)}
    </section>
    <section style=${{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
      <div class="sec-h"><h2>바로가기</h2><span class="small muted">수동 실행 트리거</span></div>
      <div class="card list">
        ${shortcuts.length ? shortcuts.map((m) => html`<div key=${m.id} class="row"><${Mono} kind="trigger" def=${TRIGGERS.manual} />
          <div class="grow"><div class="t">${m.name}</div><div class="s">${timeAgo(m.lastRun)}</div></div>
          <button type="button" class="btn primary sm" onClick=${() => engine.fire(m.id, '바로가기')}>실행</button></div>`)
          : html`<div class="empty">‘바로가기 (수동 실행)’ 트리거를 넣은 매크로가 여기에 버튼으로 나타납니다.</div>`}
      </div>
    </section>
    <section style=${{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
      <div class="sec-h"><h2>최근 기록</h2><button type="button" class="icon-btn" onClick=${() => go('log')}>전체 보기</button></div>
      <div class="card list log">${st.log.slice(0, 4).map((l, i) => html`<${LogRow} key=${i} l=${l} />`)}${!st.log.length && html`<div class="empty">아직 기록이 없습니다.</div>`}</div>
    </section>
    <p class="notice">이 앱은 브라우저에서 동작합니다. 화면이 열려 있는 동안 트리거를 감지하고, 배터리·진동·위치·흔들기처럼 기기 기능을 쓰는 항목은 브라우저가 허용할 때만 작동합니다.</p>`;
}

/* ---------------- 화면: 매크로 목록 ---------------- */
function MacroList({ st, onOpen, onToggle, onNew }) {

  const cats = [...new Set(list.map((m) => m.category || '미분류'))];
  return html`
    <div class="search"><input id="macro-search" class="inp" placeholder="매크로 검색" value=${q} onInput=${(e) => setQ(e.target.value)} /><button type="button" class="btn primary" onClick=${onNew}>추가</button></div>
    <div class="card list">
      ${cats.map((c) => html`<${React.Fragment} key=${c}><div class="cat-h">${c}</div>
        ${list.filter((m) => (m.category || '미분류') === c).map((m) => html`
          <div key=${m.id} class="row" role="button" tabIndex="0" style=${{ cursor: 'pointer' }} onClick=${() => onOpen(m.id)} onKeyDown=${(e) => e.key === 'Enter' && onOpen(m.id)}>
            <${Mono} kind="trigger" def=${TRIGGERS[(m.triggers[0] || {}).type]} off=${!m.enabled} />
            <div class="grow"><div class="t">${m.name}</div>
              <div class="s">${m.triggers.length ? summary('trigger', m.triggers[0], st) : '트리거 없음'}${m.triggers.length > 1 ? ' 외 ' + (m.triggers.length - 1) : ''} · 액션 ${m.actions.length}개${m.constraints.length ? ' · 조건 ' + m.constraints.length + '개' : ''}</div></div>
            <${Switch} on=${m.enabled} label=${m.name + ' 켜기'} onChange=${(v) => onToggle(m.id, v)} />
          </div>`)}<//>`)}
      ${!list.length && html`<div class="empty">${q ? '검색 결과가 없습니다.' : '매크로가 없습니다. 추가 버튼이나 템플릿으로 시작하세요.'}</div>`}
    </div>`;
}

/* ---------------- 화면: 매크로 편집 ---------------- */
function Field({ f, value, set, st, params, setParams }) {
  const id = 'f-' + f.k;
  switch (f.t) {
    case 'textarea':
      return html`<div class="field"><label for=${id}>${f.l}</label><textarea id=${id} class="inp" value=${value} onInput=${(e) => set(e.target.value)}></textarea>
        <div class="hint">매직 텍스트: {time} {date} {weekday} {battery} {charging} {online} {macro} {trigger} {v=변수이름}</div></div>`;
    case 'select':
      return html`<div class="field"><label for=${id}>${f.l}</label><select id=${id} class="inp" value=${value} onChange=${(e) => set(e.target.value)}>${f.o.map(([v, l]) => html`<option key=${v} value=${v}>${l}</option>`)}</select></div>`;
    case 'number':
      return html`<div class="field"><label for=${id}>${f.l}</label><input id=${id} class="inp num" type="number" inputMode="decimal" step="any" min=${f.min} max=${f.max} value=${value} onInput=${(e) => set(e.target.value === '' ? '' : Number(e.target.value))} /></div>`;
    case 'time':
      return html`<div class="field"><label for=${id}>${f.l}</label><input id=${id} class="inp num" type="time" value=${value} onInput=${(e) => set(e.target.value)} /></div>`;
    case 'days':
      return html`<div class="field"><span class="lab">${f.l}</span><div class="days">${DAYS.map((d, i) => html`<button key=${i} type="button" class=${'chip' + ((value || []).includes(i) ? ' on' : '')} aria-pressed=${(value || []).includes(i)}
          onClick=${() => set((value || []).includes(i) ? value.filter((x) => x !== i) : (value || []).concat(i))}>${d}</button>`)}</div></div>`;
    case 'macro':
      return html`<div class="field"><label for=${id}>${f.l}</label><select id=${id} class="inp" value=${value} onChange=${(e) => set(e.target.value)}>
        <option value="">선택하세요</option>${st.macros.map((m) => html`<option key=${m.id} value=${m.id}>${m.name}</option>`)}</select></div>`;
    case 'var':
      return html`<div class="field"><label for=${id}>${f.l}</label><input id=${id} class="inp" list="var-names" value=${value} onInput=${(e) => set(e.target.value.trim())} />
        <datalist id="var-names">${Object.keys(st.vars).map((v) => html`<option key=${v} value=${v}></option>`)}</datalist></div>`;
    case 'geobtn':
      return html`<${GeoButton} onPick=${(la, lo) => setParams(Object.assign({}, params, { lat: Number(la.toFixed(6)), lng: Number(lo.toFixed(6)) }))} />`;
    default:
      return html`<div class="field"><label for=${id}>${f.l}</label><input id=${id} class="inp" value=${value} onInput=${(e) => set(e.target.value)} /></div>`;
  }
}
function GeoButton({ onPick }) {
  const [msg, setMsg] = useState('');
  const get = () => {
    if (!navigator.geolocation) return setMsg('이 브라우저는 위치를 지원하지 않습니다.');
    setMsg('위치를 찾는 중…');
    navigator.geolocation.getCurrentPosition((p) => { onPick(p.coords.latitude, p.coords.longitude); setMsg('현재 위치를 넣었습니다.'); }, () => setMsg('위치 권한이 없어 직접 입력해야 합니다.'), { enableHighAccuracy: true, timeout: 10000 });
  };
  return html`<div class="field"><button type="button" class="btn sm" onClick=${get}>현재 위치로 채우기</button>${msg && html`<div class="hint">${msg}</div>`}</div>`;
}
function ItemForm({ kind, item, st, onSave, onCancel }) {
  const def = KINDS[kind].cat[item.type];
  const [params, setParams] = useState(clone(item.params));
  return html`<${Sheet} onClose=${onCancel}>
    <div style=${{ display: 'flex', alignItems: 'center', gap: '10px' }}><${Mono} kind=${kind} def=${def} /><h3>${def.label}</h3></div>
    ${def.fields.length ? def.fields.map((f) => html`<${Field} key=${f.k} f=${f} value=${params[f.k]} st=${st} params=${params} setParams=${setParams} set=${(v) => setParams(Object.assign({}, params, { [f.k]: v }))} />`)
      : html`<p class="muted small" style=${{ margin: 0 }}>설정할 항목이 없습니다.</p>`}
    <div class="btns" style=${{ justifyContent: 'flex-end' }}><button type="button" class="btn" onClick=${onCancel}>취소</button><button type="button" class="btn primary" onClick=${() => onSave(Object.assign({}, item, { params }))}>확인</button></div>
  <//>`;
}
function Picker({ kind, onPick, onClose }) {
  const K = KINDS[kind], groups = {};
  Object.entries(K.cat).forEach(([k, d]) => { (groups[d.group] = groups[d.group] || []).push([k, d]); });
  return html`<${Sheet} onClose=${onClose}>
    <h3>${K.title} 추가</h3><p class="muted small" style=${{ margin: 0 }}>${K.q}</p>
    ${Object.entries(groups).map(([g, items]) => html`<div key=${g} class="pick-g"><h4>${g}</h4><div class="pick">
      ${items.map(([k, d]) => html`<button key=${k} type="button" onClick=${() => onPick(k)}><${Mono} kind=${kind} def=${d} /><span class="lbl">${d.label}</span></button>`)}</div></div>`)}
  <//>`;
}
function Block({ kind, items, st, onAdd, onEdit, onDel, onMove }) {
  const K = KINDS[kind];
  let depth = 0;
  return html`<section class="card block">
    <div class=${'block-h k-' + kind}><h3>${K.title} <span class="num">${items.length}</span></h3><span class="q">${K.q}</span></div>
    ${!items.length && html`<div class="empty">${kind === 'constraint' ? '제약 조건이 없으면 트리거가 감지될 때마다 실행됩니다.' : '아직 없습니다.'}</div>`}
    ${items.map((it, i) => {
      if (it.type === 'else' || it.type === 'end_if') depth = Math.max(0, depth - 1);
      const ind = depth;
      if (it.type === 'if' || it.type === 'else') depth++;
      const def = K.cat[it.type];
      return html`<div key=${it.id} class="item" style=${{ paddingLeft: 14 + ind * 18 + 'px' }}>
        <${Mono} kind=${kind} def=${def} />
        <div class="grow" role="button" tabIndex="0" onClick=${() => onEdit(i)} onKeyDown=${(e) => e.key === 'Enter' && onEdit(i)}><div class="t">${def ? def.label : it.type}</div><div class="s">${summary(kind, it, st)}</div></div>
        <div class="ops">
          ${kind === 'action' && html`<button type="button" class="icon-btn" aria-label="위로" disabled=${i === 0} onClick=${() => onMove(i, -1)}>위</button>
          <button type="button" class="icon-btn" aria-label="아래로" disabled=${i === items.length - 1} onClick=${() => onMove(i, 1)}>아래</button>`}
          <button type="button" class="icon-btn" aria-label="삭제" onClick=${() => onDel(i)}>삭제</button>
        </div></div>`;
    })}
    <button type="button" class="add" onClick=${onAdd}>+ ${K.title} 추가</button>
  </section>`;
}
function Editor({ macro, st, engine, onSave, onDelete, onClose }) {
  const [d, setD] = useState(clone(macro));
  const [sheet, setSheet] = useState(null);
  const setList = (kind, list) => setD(Object.assign({}, d, { [KINDS[kind].key]: list }));
  const pick = (kind, type) => {
    const it = mk(type, {}, kind);
    if (KINDS[kind].cat[type].fields.length) setSheet({ mode: 'form', kind, item: it, index: -1 });
    else { addItem(kind, it); setSheet(null); }
  };
  const addItem = (kind, it) => {
    const list = d[KINDS[kind].key].slice(); list.push(it);
    if (kind === 'action' && it.type === 'if') list.push(mk('end_if', {}, 'action'));
    setList(kind, list);
  };
  const saveItem = (it) => {
    const { kind, index } = sheet;
    if (index < 0) addItem(kind, it); else { const l = d[KINDS[kind].key].slice(); l[index] = it; setList(kind, l); }
    setSheet(null);
  };
  const valid = d.name.trim() && d.triggers.length && d.actions.length;
  const block = (kind) => html`<${Block} kind=${kind} items=${d[KINDS[kind].key]} st=${st}
    onAdd=${() => setSheet({ mode: 'pick', kind })}
    onEdit=${(i) => setSheet({ mode: 'form', kind, item: d[KINDS[kind].key][i], index: i })}
    onDel=${(i) => setList(kind, d[KINDS[kind].key].filter((_, j) => j !== i))}
    onMove=${(i, dir) => { const l = d[KINDS[kind].key].slice(); [l[i], l[i + dir]] = [l[i + dir], l[i]]; setList(kind, l); }} />`;
  return html`
    <section class="card ed-head">
      <div class="ed-row2">
        <div class="field"><label for="m-name">매크로 이름</label><input id="m-name" class="inp" value=${d.name} placeholder="예: 퇴근길 알림" onInput=${(e) => setD(Object.assign({}, d, { name: e.target.value }))} /></div>
        <div class="field"><label for="m-cat">분류</label><input id="m-cat" class="inp" list="cats" value=${d.category} onInput=${(e) => setD(Object.assign({}, d, { category: e.target.value }))} />
          <datalist id="cats">${[...new Set(st.macros.map((m) => m.category))].map((c) => html`<option key=${c} value=${c}></option>`)}</datalist></div>
      </div>
      <div style=${{ display: 'flex', alignItems: 'center', gap: '10px' }}><${Switch} on=${d.enabled} label="매크로 켜기" onChange=${(v) => setD(Object.assign({}, d, { enabled: v }))} /><span class="small">${d.enabled ? '켜짐' : '꺼짐'}</span></div>
    </section>
    ${block('trigger')}${block('action')}${block('constraint')}
    ${!valid && html`<p class="notice">저장하려면 이름, 트리거 1개 이상, 액션 1개 이상이 필요합니다.</p>`}
    <div class="btns">
      <button type="button" class="btn primary" disabled=${!valid} onClick=${() => onSave(Object.assign({}, d, { name: d.name.trim(), category: (d.category || '').trim() || '미분류' }))}>저장</button>
      <button type="button" class="btn" disabled=${!d.actions.length} onClick=${() => engine.run(d, { label: '테스트 실행', test: true })}>테스트 실행</button>
      <button type="button" class="btn ghost" onClick=${onClose}>취소</button>
      <span style=${{ flex: 1 }}></span>
      ${st.macros.some((m) => m.id === d.id) && html`<${ConfirmBtn} label="삭제" armedLabel="한 번 더 누르면 삭제" onConfirm=${() => onDelete(d.id)} />`}
    </div>
    ${sheet && sheet.mode === 'pick' && html`<${Picker} kind=${sheet.kind} onClose=${() => setSheet(null)} onPick=${(t) => pick(sheet.kind, t)} />`}
    ${sheet && sheet.mode === 'form' && html`<${ItemForm} kind=${sheet.kind} item=${sheet.item} st=${st} onCancel=${() => setSheet(null)} onSave=${saveItem} />`}`;
}

/* ---------------- 화면: 템플릿 / 변수 / 로그 / 설정 ---------------- */
function Templates({ onUse }) {
  return html`${TEMPLATES.map((tp) => html`<section key=${tp.name} class="card tpl">
    <div><div class="small muted">${tp.category}</div><div class="t">${tp.name}</div></div>
    <div class="small">${tp.desc}</div>
    <div class="flow">${tp.t.map(([ty], i) => html`<span key=${'t' + i} class="pill k-trigger">${TRIGGERS[ty].label}</span>`)}
      ${tp.a.map(([ty], i) => html`<span key=${'a' + i} class="pill k-action">${ACTIONS[ty].label}</span>`)}
      ${tp.c.map(([ty], i) => html`<span key=${'c' + i} class="pill k-constraint">${CONSTRAINTS[ty].label}</span>`)}</div>
    <div class="btns"><button type="button" class="btn primary sm" onClick=${() => onUse(tp)}>내 매크로로 추가</button></div>
  </section>`)}`;
}
function Vars({ st, update, engine }) {
  const [n, setN] = useState(''); const [v, setV] = useState('0');
  const names = Object.keys(st.vars).sort();
  return html`<section class="card list">
    ${names.map((k) => html`<div key=${k} class="row var-row"><div class="grow"><div class="t mono-txt">${k}</div>
      <input class="inp val" aria-label=${k + ' 값'} id=${'var-' + k} value=${st.vars[k]} onChange=${(e) => engine.setVar(k, 'set', e.target.value, 0)} /></div>
      <${ConfirmBtn} cls="sm" label="삭제" armedLabel="확인" onConfirm=${() => update((s) => { const vs = Object.assign({}, s.vars); delete vs[k]; return Object.assign({}, s, { vars: vs }); })} /></div>`)}
    ${!names.length && html`<div class="empty">전역 변수가 없습니다.</div>`}
    <form class="inline-form" onSubmit=${(e) => { e.preventDefault(); const k = n.trim(); if (!k) return; engine.setVar(k, 'set', v, 0); setN(''); setV('0'); }}>
      <input id="new-var-name" class="inp" placeholder="새 변수 이름" value=${n} onInput=${(e) => setN(e.target.value)} />
      <input id="new-var-val" class="inp" placeholder="초기값" value=${v} onInput=${(e) => setV(e.target.value)} />
      <button class="btn primary" type="submit">추가</button>
    </form>
  </section>
  <p class="notice">변수는 모든 매크로가 함께 씁니다. 문장에 {v=변수이름}을 쓰면 값으로 바뀌고, ‘변수 값 변경’ 트리거와 If 액션에서 비교할 수 있습니다.</p>`;
}
function LogRow({ l }) {
  const d = new Date(l.t), lvT = { run: '실행', ok: '완료', skip: '건너뜀', err: '오류', info: '정보' }[l.lv] || l.lv;
  return html`<div class="row"><span class="tm">${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${hhmm(d)}:${pad(d.getSeconds())}</span><span class=${'lv ' + l.lv}>${lvT}</span><span class="grow" style=${{ overflowWrap: 'anywhere' }}>${l.msg}</span></div>`;
}
function Log({ st, update }) {
  const [f, setF] = useState('all');
  const list = st.log.filter((l) => f === 'all' || l.lv === f);
  return html`<div class="btns">${[['all', '전체'], ['run', '실행'], ['skip', '건너뜀'], ['err', '오류']].map(([k, l]) => html`<button key=${k} type="button" class=${'chip' + (f === k ? ' on' : '')} onClick=${() => setF(k)}>${l}</button>`)}
      <span style=${{ flex: 1 }}></span><${ConfirmBtn} cls="sm" label="기록 지우기" armedLabel="한 번 더 누르면 지움" onConfirm=${() => update((s) => Object.assign({}, s, { log: [] }))} /></div>
    <section class="card list log">${list.map((l, i) => html`<${LogRow} key=${l.t + '-' + i} l=${l} />`)}${!list.length && html`<div class="empty">기록이 없습니다.</div>`}</section>`;
}
function Settings({ st, update, toast }) {
  const [perm, setPerm] = useState('Notification' in window ? Notification.permission : 'unsupported');
  const [imp, setImp] = useState(''); const [msg, setMsg] = useState('');
  const exportText = useMemo(() => JSON.stringify({ macros: st.macros, vars: st.vars }, null, 2), [st.macros, st.vars]);
  const askNotif = async () => { try { setPerm(await Notification.requestPermission()); } catch (e) { setPerm('denied'); } };
  const askMotion = async () => {
    try { if (window.DeviceMotionEvent && DeviceMotionEvent.requestPermission) { const r = await DeviceMotionEvent.requestPermission(); toast(r === 'granted' ? '흔들기 감지를 허용했습니다.' : '흔들기 권한이 거부되었습니다.'); } else toast('이 기기는 별도 허용 없이 흔들기를 감지합니다.'); }
    catch (e) { toast('흔들기 권한을 요청할 수 없습니다.'); }
  };
  const copy = async () => { try { await navigator.clipboard.writeText(exportText); setMsg('백업 내용을 복사했습니다.'); } catch (e) { document.getElementById('export-box').select(); setMsg('자동 복사가 막혀 있어 내용을 선택해 두었습니다. 길게 눌러 복사하세요.'); } };
  const doImport = () => {
    try {
      const j = JSON.parse(imp); if (!Array.isArray(j.macros)) throw new Error();
      update((s) => Object.assign({}, s, { macros: j.macros, vars: j.vars || {} })); setImp(''); setMsg(`매크로 ${j.macros.length}개를 가져왔습니다.`);
    } catch (e) { setMsg('형식이 맞지 않습니다. 이 화면의 백업 내용을 통째로 붙여넣어 주세요.'); }
  };
  const permText = { granted: '허용됨', denied: '거부됨 (브라우저 설정에서 바꿀 수 있습니다)', default: '아직 묻지 않음', unsupported: '지원 안 함 (앱 안 팝업으로 대신 표시)' }[perm];
  return html`<section class="card list">
      <div class="row"><div class="grow"><div class="t">시스템 알림</div><div class="s">${permText}</div></div><button type="button" class="btn sm" disabled=${perm !== 'default'} onClick=${askNotif}>허용 요청</button></div>
      <div class="row"><div class="grow"><div class="t">흔들기 감지</div><div class="s">아이폰은 한 번 허용해야 합니다.</div></div><button type="button" class="btn sm" onClick=${askMotion}>허용 요청</button></div>
      <div class="row"><div class="grow"><div class="t">소리·음성 준비</div><div class="s">브라우저는 화면을 한 번 누른 뒤에만 소리를 냅니다.</div></div><button type="button" class="btn sm" onClick=${() => { try { speechSynthesis.speak(new SpeechSynthesisUtterance('준비되었습니다')); } catch (e) {} toast('소리를 켰습니다.'); }}>소리 켜기</button></div>
    </section>
    <section class="card ed-head">
      <div class="field"><label for="export-box">백업 (내보내기)</label><textarea id="export-box" class="inp mono-txt small" readOnly value=${exportText} style=${{ minHeight: '120px' }}></textarea></div>
      <div class="btns"><button type="button" class="btn sm" onClick=${copy}>백업 내용 복사</button></div>
      <div class="field"><label for="import-box">복원 (가져오기)</label><textarea id="import-box" class="inp mono-txt small" placeholder="백업 내용을 붙여넣으세요" value=${imp} onInput=${(e) => setImp(e.target.value)}></textarea></div>
      <div class="btns"><button type="button" class="btn sm" disabled=${!imp.trim()} onClick=${doImport}>가져오기</button>
        <span style=${{ flex: 1 }}></span><${ConfirmBtn} cls="sm" label="전체 초기화" armedLabel="한 번 더 누르면 초기화" onConfirm=${() => { update(() => seed()); setMsg('처음 상태로 되돌렸습니다.'); }} /></div>
      ${msg && html`<div class="hint" role="status">${msg}</div>`}
    </section>`;
}

/* ---------------- 앱 ---------------- */
function App() {
  const [st, setSt] = useState(loadState);
  const ref = useRef(st);
  const [sensors, setSensors] = useState({ battery: null, charging: null, online: navigator.onLine, orientation: 'portrait', running: 0 });
  const [tab, setTab] = useState(() => { const h = location.hash.slice(1); return ['home', 'macros', 'templates', 'vars', 'log', 'settings'].includes(h) ? h : 'home'; });
  const [editing, setEditing] = useState(null);
  const [toasts, setToasts] = useState([]);
  const update = (fn) => { ref.current = fn(ref.current); setSt(ref.current); };
  const toast = (text, title, sec) => {
    const id = uid(); setToasts((t) => t.concat({ id, text, title }).slice(-3));
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), (sec || 3) * 1000);
  };
  const engineRef = useRef(null);
  if (!engineRef.current) engineRef.current = new Engine({ get: () => ref.current, update: (fn) => update(fn), toast: (...a) => toast(...a), sensors: (s) => setSensors(s) });
  const engine = engineRef.current;
  useEffect(() => { engine.start(); }, []);
  useEffect(() => { const t = setTimeout(() => saveState(st), 250); return () => clearTimeout(t); }, [st]);
  useEffect(() => { const k = () => { try { ref.current && saveState(ref.current); } catch (e) {} }; addEventListener('pagehide', k); return () => removeEventListener('pagehide', k); }, []);

  const go = (t) => { setEditing(null); setTab(t); window.scrollTo(0, 0); };
  const newMacro = () => { setEditing({ id: uid(), name: '', category: '', enabled: true, lastRun: null, triggers: [], actions: [], constraints: [] }); window.scrollTo(0, 0); };
  const openMacro = (id) => { setEditing(clone(ref.current.macros.find((m) => m.id === id))); window.scrollTo(0, 0); };
  const saveMacro = (m) => {
    update((s) => ({ ...s, macros: s.macros.some((x) => x.id === m.id) ? s.macros.map((x) => (x.id === m.id ? m : x)) : s.macros.concat(m) }));
    toast(`「${m.name}」 저장됨`); setEditing(null); setTab('macros');
  };
  const titles = { home: '오토매크로', macros: '매크로', templates: '템플릿', vars: '변수', log: '시스템 로그', settings: '설정' };
  let body;
  if (editing) body = html`<${Editor} key=${editing.id} macro=${editing} st=${st} engine=${engine} onSave=${saveMacro} onClose=${() => setEditing(null)}
      onDelete=${(id) => { update((s) => ({ ...s, macros: s.macros.filter((x) => x.id !== id) })); toast('매크로를 삭제했습니다.'); setEditing(null); setTab('macros'); }} />`;
  else if (tab === 'home') body = html`<${Home} st=${st} sensors=${sensors} go=${go} engine=${engine} onNew=${newMacro} />`;
  else if (tab === 'macros') body = html`<${MacroList} st=${st} onOpen=${openMacro} onNew=${newMacro} onToggle=${(id, v) => update((s) => ({ ...s, macros: s.macros.map((x) => (x.id === id ? { ...x, enabled: v } : x)) }))} />`;
  else if (tab === 'templates') body = html`<${Templates} onUse=${(tp) => { const m = fromTemplate(tp); update((s) => ({ ...s, macros: s.macros.concat(m) })); toast(`「${m.name}」을(를) 추가했습니다. 눌러서 편집할 수 있습니다.`); go('macros'); }} />`;
  else if (tab === 'vars') body = html`<${Vars} st=${st} update=${update} engine=${engine} />`;
  else if (tab === 'log') body = html`<${Log} st=${st} update=${update} />`;
  else body = html`<${Settings} st=${st} update=${update} toast=${toast} />`;
  const TABS = [['home', '홈'], ['macros', '매크로'], ['templates', '템플릿'], ['vars', '변수'], ['log', '로그']];
  return html`<div class="app">
    <header class="top">
      ${editing ? html`<button type="button" class="icon-btn" onClick=${() => setEditing(null)}>뒤로</button><h1>${st.macros.some((m) => m.id === editing.id) ? '매크로 편집' : '새 매크로'}</h1>`
        : html`<h1 class="brand">${tab === 'home' && html`<span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>`}${titles[tab]}</h1>
          ${tab !== 'settings' && html`<button type="button" class="icon-btn" onClick=${() => go('settings')}>설정</button>`}`}
    </header>
    <main class="content">${body}</main>
    <nav class="tabs" aria-label="화면 전환"><div class="tabs-in">${TABS.map(([k, l]) => html`<button key=${k} type="button" class=${'tab' + (!editing && tab === k ? ' on' : '')} aria-current=${!editing && tab === k ? 'page' : undefined} onClick=${() => go(k)}><b></b>${l}</button>`)}</div></nav>
    <div class="toasts" aria-live="polite">${toasts.map((t) => html`<div key=${t.id} class="toast">${t.title && html`<b>${t.title}</b>`}${t.text}</div>`)}</div>
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
