<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <!-- ======================= gradients ======================= -->
    <radialGradient id="bg" cx="50%" cy="58%" r="85%">
      <stop offset="0%" stop-color="#132348"/>
      <stop offset="45%" stop-color="#0b1530"/>
      <stop offset="100%" stop-color="#04070f"/>
    </radialGradient>

    <linearGradient id="floorFade" x1="0" y1="880" x2="0" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1a33" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#03060c" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="wood" x1="0" y1="742" x2="0" y2="834" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9a744c"/>
      <stop offset="55%" stop-color="#7a5838"/>
      <stop offset="100%" stop-color="#4e3722"/>
    </linearGradient>

    <linearGradient id="cabinWall" x1="0" y1="380" x2="0" y2="840" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#241c15"/>
      <stop offset="45%" stop-color="#171310"/>
      <stop offset="100%" stop-color="#0d0b09"/>
    </linearGradient>

    <linearGradient id="seatFabric" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e4e7ea"/>
      <stop offset="60%" stop-color="#b9bfc7"/>
      <stop offset="100%" stop-color="#8d949e"/>
    </linearGradient>

    <linearGradient id="glassRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe3ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2a4a74" stop-opacity="0.12"/>
    </linearGradient>

    <linearGradient id="shellFill" x1="0" y1="380" x2="0" y2="840" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16305c" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#0a1730" stop-opacity="0.18"/>
    </linearGradient>

    <linearGradient id="flow1" x1="1700" y1="0" x2="1020" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#eaffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#5fd6ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1d7fd6" stop-opacity="0.12"/>
    </linearGradient>

    <linearGradient id="splitLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#dcecff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="warmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb46b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffb46b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coolGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fd2ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4fd2ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="holo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9fe8ff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#37b6ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#37b6ff" stop-opacity="0"/>
    </radialGradient>

    <!-- ======================= filters ======================= -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBig" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <!-- ======================= geometry ======================= -->
    <path id="body" d="M 320,832
      C 275,832 252,812 250,762
      L 248,500
      C 247,440 272,398 345,390
      L 1300,382
      C 1470,380 1570,430 1630,520
      C 1672,585 1690,650 1692,715
      L 1694,775
      C 1694,815 1672,830 1630,832
      L 1528,832
      A 92 92 0 0 0 1352,832
      L 578,832
      A 92 92 0 0 0 402,832
      Z"/>

    <clipPath id="clipBody"><use href="#body"/></clipPath>
    <clipPath id="clipLeft"><rect x="0" y="0" width="960" height="1080"/></clipPath>
    <clipPath id="clipRight"><rect x="960" y="0" width="960" height="1080"/></clipPath>

    <pattern id="blueprint" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M 46 0 L 0 0 0 46" fill="none" stroke="#3f8fd9" stroke-width="0.6" opacity="0.35"/>
    </pattern>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5fd6ff"/>
    </marker>
  </defs>

  <!-- ======================= backdrop ======================= -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- cinematic beams -->
  <polygon points="330,0 560,0 820,420 700,440" fill="#cfe3ff" opacity="0.035"/>
  <polygon points="1620,0 1380,0 1150,420 1290,430" fill="#8fd8ff" opacity="0.045"/>

  <!-- blueprint grid, right half only -->
  <rect x="960" y="240" width="960" height="660" fill="url(#blueprint)" opacity="0.28"/>

  <!-- warm / cool half tints -->
  <rect x="0" y="0" width="960" height="1080" fill="#ff9440" opacity="0.028"/>
  <rect x="960" y="0" width="960" height="1080" fill="#2aa8ff" opacity="0.045"/>

  <!-- studio floor -->
  <line x1="0" y1="880" x2="1920" y2="880" stroke="#2c3c5c" stroke-width="1" opacity="0.6"/>
  <rect x="0" y="880" width="1920" height="200" fill="url(#floorFade)"/>
  <ellipse cx="960" cy="886" rx="780" ry="24" fill="#000000" opacity="0.55" filter="url(#soft)"/>
  <ellipse cx="500" cy="886" rx="330" ry="20" fill="url(#warmGlow)"/>
  <ellipse cx="1420" cy="886" rx="360" ry="22" fill="url(#coolGlow)"/>

  <!-- floor reflection of the body -->
  <use href="#body" transform="translate(0,1768) scale(1,-1)" fill="#a9c4e8" opacity="0.05"/>

  <!-- ================================================================
       LEFT HALF - lounge interior cutaway
       ================================================================ -->
  <g clip-path="url(#clipLeft)">
    <!-- body shell, warm paint edge -->
    <use href="#body" fill="#0f1626" stroke="#7f8ea6" stroke-width="2.5"/>

    <g clip-path="url(#clipBody)">
      <!-- cabin walls and floor -->
      <rect x="240" y="380" width="740" height="460" fill="url(#cabinWall)"/>
      <rect x="240" y="742" width="740" height="92" fill="url(#wood)"/>
      <g stroke="#3c2a18" stroke-width="1.4" opacity="0.55">
        <line x1="250" y1="762" x2="980" y2="762"/>
        <line x1="250" y1="784" x2="980" y2="784"/>
        <line x1="250" y1="806" x2="980" y2="806"/>
      </g>

      <!-- daylight shaft from the panoramic roof -->
      <polygon points="380,404 900,400 830,742 470,742" fill="#ffffff" opacity="0.05"/>

      <!-- panoramic glass roof band -->
      <rect x="345" y="388" width="615" height="22" rx="8" fill="url(#glassRoof)"/>
      <line x1="560" y1="389" x2="560" y2="409" stroke="#9db8d6" stroke-width="1.4" opacity="0.7"/>
      <line x1="770" y1="388" x2="770" y2="408" stroke="#9db8d6" stroke-width="1.4" opacity="0.7"/>

      <!-- ceiling ambient LED line -->
      <line x1="300" y1="424" x2="958" y2="420" stroke="#ffb264" stroke-width="3.5" filter="url(#glowBig)" opacity="0.95"/>
      <!-- lower accent light along floor edge -->
      <line x1="300" y1="744" x2="958" y2="744" stroke="#ff9a4d" stroke-width="2" filter="url(#glow)" opacity="0.7"/>
      <!-- warm cabin pools -->
      <ellipse cx="620" cy="560" rx="330" ry="200" fill="url(#warmGlow)" opacity="0.5"/>

      <!-- rear-facing swivel seat (faces left / rearward) -->
      <g>
        <ellipse cx="452" cy="744" rx="60" ry="10" fill="#c9a24a" opacity="0.35" filter="url(#glow)"/>
        <ellipse cx="452" cy="740" rx="46" ry="9" fill="#5c452c"/>
        <rect x="440" y="676" width="24" height="62" rx="8" fill="#8d949e"/>
        <path d="M 398,676 q 54,-16 108,0 l -6,26 q -48,-12 -96,0 z" fill="url(#seatFabric)"/>
        <path d="M 486,540 q 26,-4 30,26 l 12,110 q 2,18 -18,20 l -24,2 q -16,0 -18,-18 l -6,-112 q -2,-24 24,-28 z" fill="url(#seatFabric)"/>
        <rect x="486" y="516" width="40" height="34" rx="12" fill="#d7dbe0"/>
        <path d="M 398,668 q 56,-20 116,-4 l -4,20 q -54,-14 -108,2 z" fill="#a9b0b9"/>
      </g>

      <!-- oval wood side table between seats -->
      <g>
        <rect x="596" y="668" width="12" height="74" rx="5" fill="#6f7781"/>
        <ellipse cx="602" cy="666" rx="52" ry="12" fill="#9a744c" stroke="#5c4227" stroke-width="2"/>
        <ellipse cx="602" cy="662" rx="52" ry="12" fill="#b0885c"/>
        <!-- small warm lamp on the table -->
        <circle cx="620" cy="648" r="6" fill="#ffd9a0" filter="url(#glowBig)"/>
      </g>

      <!-- forward-facing lounge seat (faces right / forward) -->
      <g>
        <ellipse cx="790" cy="744" rx="60" ry="10" fill="#c9a24a" opacity="0.35" filter="url(#glow)"/>
        <ellipse cx="790" cy="740" rx="46" ry="9" fill="#5c452c"/>
        <rect x="778" y="676" width="24" height="62" rx="8" fill="#8d949e"/>
        <path d="M 736,676 q 54,-16 108,0 l -6,26 q -48,-12 -96,0 z" fill="url(#seatFabric)"/>
        <path d="M 754,540 q -26,-4 -30,26 l -12,110 q -2,18 18,20 l 24,2 q 16,0 18,-18 l 6,-112 q 2,-24 -24,-28 z" fill="url(#seatFabric)"/>
        <rect x="716" y="516" width="40" height="34" rx="12" fill="#d7dbe0"/>
        <path d="M 844,668 q -56,-20 -116,-4 l 4,20 q 54,-14 108,2 z" fill="#a9b0b9"/>
      </g>
    </g>

    <!-- rear pixel taillamps -->
    <g fill="#ff8a5c" filter="url(#glow)">
      <rect x="254" y="470" width="10" height="10"/>
      <rect x="254" y="486" width="10" height="10"/>
      <rect x="254" y="502" width="10" height="10"/>
    </g>

    <!-- rear wheel, solid -->
    <circle cx="490" cy="806" r="72" fill="#0a0d13" stroke="#525f72" stroke-width="5"/>
    <circle cx="490" cy="806" r="42" fill="none" stroke="#8b99ad" stroke-width="3"/>
    <g stroke="#8b99ad" stroke-width="4" stroke-linecap="round">
      <line x1="490" y1="776" x2="490" y2="836"/>
      <line x1="460" y1="806" x2="520" y2="806"/>
      <line x1="469" y1="785" x2="511" y2="827"/>
      <line x1="511" y1="785" x2="469" y2="827"/>
    </g>
    <circle cx="490" cy="806" r="9" fill="#c9d3df"/>
  </g>

  <!-- ================================================================
       RIGHT HALF - X-ray steel frame
       ================================================================ -->
  <g clip-path="url(#clipRight)">
    <!-- translucent shell -->
    <use href="#body" fill="url(#shellFill)" stroke="#a9bdd6" stroke-width="2"/>
    <use href="#body" fill="none" stroke="#5fd6ff" stroke-width="0.8" opacity="0.5" transform="translate(0,-4)"/>

    <!-- glowing steel skeleton -->
    <g stroke="#4cc9ff" fill="none" stroke-linecap="round" filter="url(#glow)">
      <!-- rocker + floor rails -->
      <line x1="965" y1="828" x2="1626" y2="828" stroke-width="7"/>
      <line x1="965" y1="796" x2="1640" y2="796" stroke-width="4"/>
      <line x1="965" y1="770" x2="1616" y2="770" stroke-width="3"/>
      <!-- floor cross members -->
      <g stroke-width="3">
        <line x1="1050" y1="770" x2="1050" y2="828"/>
        <line x1="1150" y1="770" x2="1150" y2="828"/>
        <line x1="1250" y1="770" x2="1250" y2="828"/>
        <line x1="1580" y1="770" x2="1580" y2="828"/>
      </g>
      <!-- B-pillar at the split -->
      <line x1="990" y1="830" x2="990" y2="388" stroke-width="6"/>
      <!-- C-pillar mid frame -->
      <line x1="1240" y1="770" x2="1240" y2="384" stroke-width="4"/>
      <!-- roof rail and raked front pillar -->
      <path d="M 968,388 L 1300,384 C 1460,383 1566,436 1624,524" stroke-width="5"/>
      <!-- front lower load path into the crumple zone -->
      <path d="M 1616,770 C 1660,766 1682,742 1686,712" stroke-width="4"/>
      <!-- crash boxes with X-bracing -->
      <g stroke-width="2.5">
        <rect x="1628" y="688" width="30" height="52" rx="4"/>
        <line x1="1628" y1="688" x2="1658" y2="740"/>
        <line x1="1658" y1="688" x2="1628" y2="740"/>
        <rect x="1596" y="692" width="26" height="46" rx="4"/>
        <line x1="1596" y1="692" x2="1622" y2="738"/>
        <line x1="1622" y1="692" x2="1596" y2="738"/>
      </g>
      <!-- battery / floor structure -->
      <rect x="1010" y="802" width="470" height="22" rx="6" stroke-width="2" stroke-dasharray="10 7" opacity="0.85"/>
    </g>

    <!-- crash-impact energy flow lines, front to rear -->
    <g fill="none" stroke="url(#flow1)" stroke-linecap="round" filter="url(#glowBig)">
      <path d="M 1688,706 C 1600,700 1510,764 1400,782 L 1060,792" stroke-width="6" marker-end="url(#arrow)"/>
      <path d="M 1682,648 C 1610,560 1500,470 1350,424 C 1220,394 1100,390 1000,390" stroke-width="5" marker-end="url(#arrow)"/>
      <path d="M 1690,738 C 1636,790 1520,824 1380,827 L 1040,828" stroke-width="5" marker-end="url(#arrow)"/>
    </g>

    <!-- impact point ripples at the front bumper -->
    <g fill="none" stroke="#bdefff" stroke-linecap="round" filter="url(#glow)">
      <path d="M 1712,660 A 60 60 0 0 1 1712,760" stroke-width="4" opacity="0.9"/>
      <path d="M 1736,636 A 92 92 0 0 1 1736,784" stroke-width="3" opacity="0.55"/>
      <path d="M 1760,614 A 124 124 0 0 1 1760,806" stroke-width="2" opacity="0.3"/>
    </g>

    <!-- pixel DRL on the front face -->
    <g fill="#d9f4ff" filter="url(#glow)">
      <rect x="1650" y="560" width="11" height="11"/>
      <rect x="1666" y="560" width="11" height="11"/>
      <rect x="1650" y="576" width="11" height="11"/>
      <rect x="1666" y="576" width="11" height="11"/>
    </g>

    <!-- front wheel, x-ray -->
    <circle cx="1440" cy="806" r="72" fill="none" stroke="#4cc9ff" stroke-width="3" filter="url(#glow)"/>
    <circle cx="1440" cy="806" r="42" fill="none" stroke="#4cc9ff" stroke-width="2" opacity="0.8"/>
    <g stroke="#4cc9ff" stroke-width="2" stroke-linecap="round" opacity="0.8">
      <line x1="1440" y1="764" x2="1440" y2="848"/>
      <line x1="1398" y1="806" x2="1482" y2="806"/>
      <line x1="1410" y1="776" x2="1470" y2="836"/>
      <line x1="1470" y1="776" x2="1410" y2="836"/>
    </g>
    <circle cx="1440" cy="806" r="8" fill="#aee6ff" filter="url(#glow)"/>

    <!-- holographic safety shield above the hood -->
    <g transform="translate(1560,296)">
      <circle r="74" fill="url(#holo)"/>
      <path d="M 0,-46 L 38,-30 L 38,10 C 38,36 20,52 0,60 C -20,52 -38,36 -38,10 L -38,-30 Z"
            fill="#123a5e" fill-opacity="0.45" stroke="#8fe2ff" stroke-width="3" filter="url(#glow)"/>
      <path d="M -17,4 L -5,18 L 20,-14" fill="none" stroke="#d8f6ff" stroke-width="5"
            stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
      <ellipse cy="86" rx="58" ry="9" fill="none" stroke="#5fd6ff" stroke-width="1.6" opacity="0.7"/>
      <ellipse cy="98" rx="34" ry="6" fill="none" stroke="#5fd6ff" stroke-width="1.2" opacity="0.45"/>
      <line x1="0" y1="106" x2="0" y2="196" stroke="#5fd6ff" stroke-width="1.4" stroke-dasharray="3 6" opacity="0.6"/>
    </g>
  </g>

  <!-- ======================= centre split seam ======================= -->
  <rect x="958.5" y="330" width="3" height="580" fill="url(#splitLine)"/>
  <circle cx="960" cy="620" r="5" fill="#ffffff" opacity="0.85" filter="url(#glowBig)"/>

  <!-- ======================= typography ======================= -->
  <!-- top corners kept minimal; centre-top stays clear for the report title -->
  <text x="84" y="72" fill="#7e90aa" font-size="15" letter-spacing="5">CONCEPT STUDY — 2026</text>
  <text x="1836" y="72" fill="#7e90aa" font-size="15" letter-spacing="5" text-anchor="end">PURPOSE BUILT VEHICLE</text>

  <!-- left caption -->
  <g>
    <line x1="120" y1="912" x2="120" y2="972" stroke="#ffb264" stroke-width="3"/>
    <text x="140" y="934" fill="#eef1f5" font-size="21" letter-spacing="3" font-weight="600">LOUNGE INTERIOR</text>
    <text x="140" y="962" fill="#98a8bd" font-size="14" letter-spacing="1.5">Swivel seating · Ambient lighting · Panoramic glass roof · Wood &amp; fabric cabin</text>
  </g>

  <!-- right caption -->
  <g text-anchor="end">
    <line x1="1800" y1="912" x2="1800" y2="972" stroke="#4cc9ff" stroke-width="3"/>
    <text x="1780" y="934" fill="#eef1f5" font-size="21" letter-spacing="3" font-weight="600">ULTRA HIGH-STRENGTH STEEL FRAME</text>
    <text x="1780" y="962" fill="#98a8bd" font-size="14" letter-spacing="1.5">Hot-stamped structure · Crash-energy load paths · Integrated safety shield</text>
  </g>

  <!-- footer -->
  <line x1="120" y1="1024" x2="690" y2="1024" stroke="#42587a" stroke-width="1"/>
  <line x1="1230" y1="1024" x2="1800" y2="1024" stroke="#42587a" stroke-width="1"/>
  <text x="960" y="1031" fill="#9db0c9" font-size="17" letter-spacing="12" text-anchor="middle">P B V &#160; C O N C E P T</text>
</svg>
